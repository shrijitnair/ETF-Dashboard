name: Add instrument

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Ticker, for example CSCO, SMH, or VUSA"
        required: true
        type: string
      tab_id:
        description: "Where should the instrument be added?"
        required: true
        type: choice
        options:
          - us-stocks
          - us-etfs
          - ucits-etfs-lse

permissions:
  contents: write

concurrency:
  group: add-instrument
  cancel-in-progress: false

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate and add instrument
        run: >-
          python scripts/add_instrument.py
          --symbol "${{ inputs.symbol }}"
          --tab-id "${{ inputs.tab_id }}"

      - name: Rebuild dashboard data
        run: python scripts/build_data.py --out-dir data

      - name: Commit watchlist and dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/custom_watchlists.json data/
          git commit -m "Add ${{ inputs.symbol }} to ${{ inputs.tab_id }} [skip ci]"
          git push
