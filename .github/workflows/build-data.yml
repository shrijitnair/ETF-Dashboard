name: Build Dashboard Data

on:
  schedule:
    - cron: '*/10 * * * *' # Market data refreshes every 10 minutes; MF NAV cache opens twice daily at 11:30 and 23:30 IST
  workflow_dispatch:
    inputs:
      force_mf_refresh:
        description: 'Fetch every mutual fund NAV again, even if this window was already checked'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
      - master
    paths:
      - '**'

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build data
        env:
          FORCE_MF_REFRESH: ${{ github.event.inputs.force_mf_refresh }}
        run: |
          if [[ "$FORCE_MF_REFRESH" == "true" ]]; then
            python scripts/build_data.py --out-dir data --force-mf-refresh
          else
            python scripts/build_data.py --out-dir data
          fi

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto-update dashboard data [skip ci]"
            git push
          fi
